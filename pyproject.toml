[project]
name = "pulsar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.0.0",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "sherpa-onnx>=2.0.1",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar"]
